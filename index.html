<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a0d08"><link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0a0710}
body{font-family:'DotGothic16','Hiragino Sans','Microsoft YaHei',monospace;color:#f6e7c8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{position:relative;width:min(100vw,calc((100vh - 16px)*1.6),1120px);aspect-ratio:8/5;border:4px solid #3a1c10;box-shadow:0 0 0 4px #120d14,0 0 40px #d93a3533;font-size:clamp(10px,1.45vw,16px);user-select:none}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.ov{position:absolute;pointer-events:none;display:flex;gap:.6em}.ov *{pointer-events:auto}
.bx{background:#241410ee;border:3px solid #f2b84b;box-shadow:0 3px 0 #000;padding:.4em .8em}
.btn{font:inherit;color:#fff;background:#d93a35;border:3px solid #3a1c10;box-shadow:inset 0 -3px 0 #8f1f1c,0 3px 0 #000;padding:.4em .9em;cursor:pointer}
.btn:hover:not(:disabled){background:#f0504a}.btn:disabled{filter:grayscale(1);opacity:.5;cursor:default}
.btn.g{background:#3f8f3a;border-color:#1b4a17;box-shadow:inset 0 -3px 0 #25601f,0 3px 0 #123a10}.btn.g:hover:not(:disabled){background:#4fa848}
.ico{width:2.6em;height:auto;image-rendering:pixelated;display:block}
.bar{height:.7em;background:#000;border:2px solid #f2b84b;width:9em;margin-top:.2em}.bar i{display:block;height:100%;background:#f2b84b}
.tt{font-size:3.2em;color:#ffe9a8;text-shadow:3px 3px 0 #d93a35,6px 6px 0 #000;letter-spacing:.1em}
.blink{animation:bl 1s steps(2) infinite;text-shadow:2px 2px 0 #000;font-size:1.4em}
.it{display:flex;flex-direction:column;align-items:center;gap:.2em;font:inherit;color:#f6e7c8;background:#3a1c10;border:3px solid #8a4f24;padding:.3em .5em;cursor:pointer}.it:hover{border-color:#ffd24a}
.slot{width:3.2em;height:2.8em;border:2px dashed #8a4f24;display:flex;align-items:center;justify-content:center}
.tt2{position:relative;margin-top:2.5%;font-family:"Chiron GoRound TC","Mochiy Pop One",sans-serif;font-weight:900;font-size:4.8em;color:#fff;-webkit-text-stroke:.13em #e0455a;paint-order:stroke fill;text-shadow:none;letter-spacing:.06em;pointer-events:none}
.btn.big{font-size:1.7em;padding:.35em 1.4em}.tt2 .ch{display:inline-block;animation:tw 1.8s steps(6) infinite}@keyframes tw{0%,60%,100%{transform:translateY(0)}20%{transform:translateY(-.12em)}40%{transform:translateY(.03em)}}.tdot{display:inline-block;width:.7em;height:.7em;margin:0 .25em;background:#5a3a24;border:2px solid #000}.tdot.on{background:#ffd24a}
@keyframes bob{50%{transform:translateY(.1em) rotate(-1.5deg)}}
.pop{animation:pop .5s steps(6)}.res{font-size:2.4em;color:#ffd24a;text-shadow:3px 3px 0 #000;animation:pop .5s steps(6)}
@keyframes pop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
@keyframes fill{from{width:0}}@keyframes bl{50%{opacity:0}}

/* ===== 固定比例畫面 (電腦/橫放 16:10、手機直放 9:16) ===== */
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
html,body{height:100%}body{touch-action:manipulation;align-items:center;justify-content:center;overflow:hidden}
.btn{white-space:nowrap}.btn.tb{font-size:.9em;padding:.4em .7em;min-height:0}
.wrap{--sw:min(100vw,calc(100vh*1.6));width:var(--sw);height:auto;aspect-ratio:8/5;border:0;box-shadow:none;background:#1a0d08;font-size:clamp(10px,calc(var(--sw)*.0144),44px)}
@supports (height:100dvh){html{height:100dvh}.wrap{--sw:min(100vw,calc(100dvh*1.6))}}
.wrap canvas{width:100%;height:100%;object-fit:fill}
.bx[style*="width: 78%"]{max-width:none}
.it{flex:1 1 0;min-width:0;white-space:nowrap;font-size:.85em;padding:.3em .15em}.it .ico{max-width:100%}
html.lp .wrap{--sw:min(100vw,calc(100vh*.5625));aspect-ratio:9/16;display:flex;flex-direction:column;justify-content:center;padding-top:9.5em;font-size:clamp(11px,calc(var(--sw)*.04),22px);overflow:hidden;margin:auto}
@supports (height:100dvh){html.lp .wrap{--sw:min(100vw,calc(100dvh*.5625))}}
html.lp .wrap canvas{width:100%;height:auto;aspect-ratio:8/5;flex:none}
html.lp .ov{flex-wrap:wrap}
html.lp .bx[style*="width: 6"],html.lp .bx[style*="width: 7"]{width:94%!important;max-width:none}
html.lp .btn{padding:.6em 1em;font-size:1.15em;min-height:2.6em}
html.lp .btn.tb{font-size:.9em;padding:.4em .7em;min-height:0}
html.lp .ov.hudr{position:static!important;width:100%;justify-content:center;gap:.6em;padding:.7em .6em}
html.lp .ov.hudr>.bx{flex:1 1 100%;display:flex;gap:.6em;align-items:center}
html.lp .ov.hudr>.btn{flex:1 1 20%}
html.lp .ov.hudr>.vtog{flex:none;width:6.2em;min-width:0;min-height:0;padding:.5em .2em;font-size:1em}
.ov.hint.dm{flex-wrap:nowrap!important;white-space:nowrap;align-items:center;gap:.5em}html .ov.hint.dm .btn{font-size:.85em!important;padding:.25em .6em!important;min-height:0!important;flex:none!important}html .ov.hint.dm .blink{font-size:1.1em!important}.btn:active:not(:disabled),.btn.pr:not(:disabled){transform:translateY(2px) scale(.97);box-shadow:inset 0 2px 0 #0008,0 0 0 2px #fff7!important;filter:brightness(.82)}.it:active:not(:disabled),.it.pr:not(:disabled){transform:translateY(2px) scale(.96);filter:brightness(.82);border-color:#fff;box-shadow:0 0 0 2px #fff7}.btn,.it{transition:transform .06s,filter .06s,box-shadow .06s}.btn.bought:disabled{filter:none;opacity:1;background:#f2b84b;color:#3a1c10;border-color:#8a5a10;box-shadow:inset 0 -3px 0 #c48a1c,0 3px 0 #000}html.lp .wrap:has(.shopm) .ov.hint.dm{position:absolute!important;top:.2em;left:0;right:0;padding:0;z-index:30}.brk{display:none}.st2.ph{display:none}html.ll .st2.ph{display:block;visibility:hidden;pointer-events:none;border-color:transparent;box-shadow:none}html.ll .crow{flex-wrap:wrap;justify-content:center;width:30em;max-width:100%}.rsl{width:16em}html.ll .rsl{width:100%}html.ll .crow .st2{flex:0 0 100%;min-height:0;padding-top:.1em;padding-bottom:.1em}html.lp .ov.hudr>.brk{display:block;flex:0 0 100%;height:0;margin:-.3em 0}.lvbx{text-align:center}.lvbx .bar{margin:.2em auto 0}
html.lp .ov.hudr>.bx.lvbx{justify-content:center}
.it:disabled{cursor:default;border-color:#5a3a24}
html.lp .ov.hudr>.tsave,html.lp .ov.hudr>.tleave{position:absolute;top:.6em;width:6.2em;min-width:0;min-height:0;flex:none;padding:.5em .2em;font-size:1em}
html.lp .ov.hudr>.tleave{right:.6em}html.lp .ov.hudr>.tsave{right:7.2em}
html.lp .ov.bn{top:7.7em!important;left:0!important;right:0!important}
html.lp .ov.bn .bx{font-size:.95em!important;padding:.2em .6em}
html.lp .ov.hint{position:static!important;justify-content:center;padding:.4em 0}
html.lp .ov.sv{position:relative!important;bottom:auto!important;left:auto!important;transform:none!important;width:100%!important;max-width:none!important;border-width:3px 0 0;padding:.6em}
html.lp .ov.sv div{flex-wrap:wrap!important;justify-content:center}
html.lp .ov.sv .it{flex:1 1 17%;font-size:.9em;padding:.35em .1em}
html.lp .ov.sv .slot{width:2.9em;height:2.7em}
html.lp .ov.sv{gap:.4em}
html.lp .ov.sv .btn{padding:.4em .8em;min-height:2.2em}
html.lp .ov.sv .btn{flex:1 1 40%}
html.lp .wrap:has(.sv){padding-top:1em}
html.lp .wrap:has(.sv) .hudr{display:none}
html.lp .wrap:has(.sv) .ov.hint.dm{position:absolute!important;top:.2em;left:0;right:0;padding:0;z-index:5}
html.lp .tcol{left:0!important;right:0;justify-content:space-between!important;align-items:center!important;padding:7% 0 7%}
html.lp .tt2{font-size:3.6em;text-align:center}
html.lp .tbtn{flex-direction:row!important;flex-wrap:wrap;justify-content:center;align-items:center!important;width:84%}
html.lp .tbtn .btn{flex:1 1 40%}html.lp .tbtn .btn.big{flex:1 1 100%}
html:not(.sm) .vtog{display:none}
@media (orientation:portrait) and (max-width:900px){
html.ll .wrap{--sw:min(100vh,calc(100vw*1.6));position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}
@supports (height:100dvh){html.ll .wrap{--sw:min(100dvh,calc(100vw*1.6))}}
}
/* 手機橫式:操作字體與按鈕放大 */
html.ll.sm .ov.sv{font-size:1.25em}html.ll.sm .ov.hudr .btn,html.ll.sm .ov.hint .btn{font-size:1.25em}html.ll.sm .ov.hudr .lvbx{font-size:1.2em}html.ll.sm .mny{font-size:1.2em}html.ll.sm .blink{font-size:1.7em}
html.lp .shopm{width:94%!important}
.tpc{display:flex;align-items:center;gap:.5em;border:3px solid #8a4f24;background:#3a1c10}.tpc>div{flex:1;min-width:0}
html.lp .tpc{display:grid;grid-template-columns:auto 1fr;gap:.4em .6em;align-items:center}html.lp .tpc>.act{grid-column:1/-1;width:100%;text-align:center;min-height:0;padding:.35em .2em;font-size:1em}html.lp .tpc .ico{width:2.4em}html.lp .upg{grid-template-columns:1fr!important}
/* 平板/手機橫放:不限制最大寬度,依螢幕等比放到最大 */
@media (orientation:landscape){html.ll.sm .wrap{--sw:min(100vw,calc(100vh*1.6));font-size:clamp(10px,calc(var(--sw)*.0144),44px)}}
@supports (height:100dvh){@media (orientation:landscape){html.ll.sm .wrap{--sw:min(100vw,calc(100dvh*1.6))}}}

const CUSTS=[];
function prepCust(im){const w=im.naturalWidth,h=im.naturalHeight;try{const a=document.createElement('canvas');a.width=w;a.height=h;const g=a.getContext('2d');g.drawImage(im,0,0);const d=g.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
if(x1<0)return null;const bw=x1-x0+1,bh=y1-y0+1;let s=1;
for(let k=8;k>1&&s===1;k--){if(bw%k||bh%k)continue;let ok=true;
for(let y=0;y<bh&&ok;y++)for(let x=0;x<bw;x++){const i=((y0+y)*w+x0+x)*4,j=((y0+y-y%k)*w+x0+x-x%k)*4;if(Math.abs(d[i]-d[j])+Math.abs(d[i+1]-d[j+1])+Math.abs(d[i+2]-d[j+2])+Math.abs(d[i+3]-d[j+3])>24){ok=false;break}}
if(ok)s=k}
const ow=bw/s|0,oh=bh/s|0,o=document.createElement('canvas');o.width=ow;o.height=oh;const og=o.getContext('2d'),od=og.createImageData(ow,oh);
for(let y=0;y<oh;y++)for(let x=0;x<ow;x++){const i=((y0+y*s)*w+x0+x*s)*4,j=(y*ow+x)*4;od.data[j]=d[i];od.data[j+1]=d[i+1];od.data[j+2]=d[i+2];od.data[j+3]=d[i+3]>128?255:0}
og.putImageData(od,0,0);return o}catch(e){im.__raw=1;return im}}
